<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden}
body{position:relative;background:linear-gradient(180deg,#f8f2e8 0%,#f3eadb 45%,#f3eadb 100%);font-family:'Montserrat',sans-serif;color:#0f1b2a}
.photo{position:absolute;left:0;right:0;bottom:118px;height:600px}
.photo .img{position:absolute;inset:0;background:url('bridge-1.jpg') center 62%/cover no-repeat;filter:sepia(.32) saturate(1.15) brightness(1.04)}
.photo:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#f3eadb 0%,rgba(243,234,219,.9) 12%,rgba(243,234,219,.45) 28%,rgba(243,234,219,0) 46%,rgba(243,234,219,0) 70%,rgba(243,234,219,.88) 92%,#f3eadb 100%)}
.top{position:relative;text-align:center;padding-top:62px}
.logo{height:118px;mix-blend-mode:multiply}
h1{font-family:'Cinzel',serif;font-weight:600;line-height:.98;margin-top:44px;letter-spacing:1px}
h1 .a{display:block;font-size:104px}
h1 .b{display:block;font-size:150px;font-weight:700}
.rule{width:470px;height:3px;background:#a8864f;margin:30px auto 30px}
.sub{font-size:31px;letter-spacing:7px;font-weight:500;line-height:1.5}
.tag{font-size:28px;margin-top:22px;font-weight:500;color:#1b2d44}
.pillars{position:absolute;left:0;right:0;bottom:146px;display:flex;justify-content:center;align-items:center;gap:26px;font-family:'Cinzel',serif;font-size:30px;letter-spacing:3px;color:#0f1b2a;font-weight:600}
.pillars i{width:2px;height:34px;background:#a8864f;display:block}
.band{position:absolute;left:0;right:0;bottom:0;height:118px;background:#0f1b2a;display:flex;align-items:center;justify-content:center;gap:30px}
.band span{font-family:'Cinzel',serif;color:#c9a96e;font-size:27px;letter-spacing:7px;white-space:nowrap}
.band b{display:block;width:90px;height:1.5px;background:#a8864f}
.credit{position:absolute;right:16px;bottom:124px;font-size:11px;color:rgba(15,27,42,.55)}
</style></head><body>
<div class="photo"><div class="img"></div></div>
<div class="top">
  <img class="logo" src="orvys-logo.webp" alt="">
  <h1><span class="a">INTRODUCING</span><span class="b">ORVYS.</span></h1>
  <div class="rule"></div>
  <div class="sub">A NEW PERSPECTIVE ON<br>STRATEGY, SUSTAINABILITY &amp; IMPACT.</div>
  <div class="tag">Rooted in Bihar. Building CSR that reaches where it matters.</div>
</div>
<div class="pillars"><span>CSR</span><i></i><span>ESG</span><i></i><span>SUSTAINABILITY</span><i></i><span>SOCIAL IMPACT</span></div>
<div class="credit">Photo: Gandhi Setu, Patna · Aksveer, CC BY-SA 4.0</div>
<div class="band"><b></b><span>STRATEGY. SUSTAINABILITY. IMPACT.</span><b></b></div>
</body></html>
